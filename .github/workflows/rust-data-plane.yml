name: Rust data plane offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  data-plane:
    runs-on: ubuntu-24.04
    env:
      # The tests retain their own explicit concurrent workers/processes.
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install declared minimum Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Check data-plane formatting
        run: cargo +1.85.0 fmt -p capture-contract -p quality-core -p capture-observer -p d2c-core -p depth-output -p offline-depth -p frame-core -p orbbec-sys -p orbbec-safe -p capture-probe -p ros-output --check
      - name: Offline hardware-independent tests
        run: cargo +1.85.0 test --locked -p capture-contract -p quality-core -p capture-observer -p d2c-core -p depth-output -p offline-depth -p frame-core -p orbbec-sys -p orbbec-safe -p capture-probe -p ros-output
      - name: Test read-only ROS observer decoding without ROS
        run: python3 -m unittest discover -s tools/observation -p 'test_*.py'
      - name: Lint data plane
        run: cargo +1.85.0 clippy --locked -p capture-contract -p quality-core -p capture-observer -p d2c-core -p depth-output -p offline-depth -p frame-core -p orbbec-sys -p orbbec-safe -p capture-probe -p ros-output --all-targets -- -D warnings

  ros-humble-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build isolated ROS Humble publisher adapter
        run: docker build -f ros/Dockerfile -t geminidepthport-ros-bridge:ci .
      - name: Verify synthetic ROS message bytes, metadata, calibration and QoS
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp
          -e ROS_LOCALHOST_ONLY=0 -e ROS_LOG_DIR=/tmp/ros-logs
          geminidepthport-ros-bridge:ci
      - name: Verify fragmented Image and String across isolated IPC containers
        run: bash ros/tests/cross_container_smoke.sh geminidepthport-ros-bridge:ci

  rust-capture-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build opt-in service from pinned public SDK sources
        run: docker build -f capture.Dockerfile -t geminidepthport-rust-capture:ci .
      - name: Verify executable ABI and immutable runtime without opening hardware
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp
          geminidepthport-rust-capture:ci python3 /opt/gdp-capture/smoke_image.py
      - name: Verify service worker accepts its Docker PID 1 supervisor
        run: bash scripts/validation/pid1_service_smoke.sh geminidepthport-rust-capture:ci
